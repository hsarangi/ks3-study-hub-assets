<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">One decision, two possible branches</title><desc id="desc">Start with score 5. Test score greater than or equal to 5. True leads left to print Win; false leads right to print Keep going. Both branches lead to End.</desc><rect width="480" height="320" fill="white"/><rect x="150" y="10" width="180" height="38" rx="10" fill="#e8f5f1" stroke="#507d79"/><text x="240" y="35" font-family="Arial,sans-serif" font-size="18" fill="#153847" text-anchor="middle">score = 5</text><path d="M240 48L240 70" fill="none" stroke="#167b79" stroke-width="2"/><polygon fill="#167b79" points="240,70 236.16459569116637,62.97933950487702 243.83540430883363,62.97933950487702"/><polygon points="240,72 350,127 240,182 130,127" fill="#fff3c9" stroke="#997c2f"/><text x="240" y="134" font-family="Arial,sans-serif" font-size="18" fill="#153847" text-anchor="middle">score &gt;= 5?</text><path d="M130 127L85 127" fill="none" stroke="#167b79" stroke-width="2"/><polygon fill="#167b79" points="85,127 92.02066049512298,123.16459569116637 92.02066049512298,130.83540430883363"/><path d="M85 127L85 200" fill="none" stroke="#167b79" stroke-width="2"/><polygon fill="#167b79" points="85,200 81.16459569116637,192.97933950487703 88.83540430883362,192.97933950487703"/><path d="M350 127L395 127" fill="none" stroke="#167b79" stroke-width="2"/><polygon fill="#167b79" points="395,127 387.97933950487703,130.83540430883363 387.97933950487703,123.16459569116637"/><path d="M395 127L395 200" fill="none" stroke="#167b79" stroke-width="2"/><polygon fill="#167b79" points="395,200 391.16459569116637,192.97933950487703 398.83540430883363,192.97933950487703"/><text x="88" y="110" font-family="Arial,sans-serif" font-size="16" fill="#153847" text-anchor="middle">True</text><text x="392" y="110" font-family="Arial,sans-serif" font-size="16" fill="#153847" text-anchor="middle">False</text><rect x="15" y="202" width="140" height="42" rx="10" fill="#e8f5f1" stroke="#507d79"/><text x="85" y="229" font-family="Arial,sans-serif" font-size="18" fill="#153847" text-anchor="middle">Print Win</text><rect x="310" y="202" width="165" height="42" rx="10" fill="#e8f5f1" stroke="#507d79"/><text x="392.5" y="229" font-family="Arial,sans-serif" font-size="18" fill="#153847" text-anchor="middle">Print Keep going</text><path d="M85 244V270H240 M392 244V270H240" fill="none" stroke="#167b79" stroke-width="2"/><path d="M240 270L240 283" fill="none" stroke="#167b79" stroke-width="2"/><polygon fill="#167b79" points="240,283 236.16459569116637,275.97933950487703 243.83540430883363,275.97933950487703"/><rect x="195" y="285" width="90" height="32" rx="10" fill="#e8f5f1" stroke="#507d79"/><text x="240" y="307" font-family="Arial,sans-serif" font-size="18" fill="#153847" text-anchor="middle">End</text></svg>