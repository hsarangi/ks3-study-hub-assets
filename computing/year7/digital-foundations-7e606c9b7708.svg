<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">Stop, check and report</title><desc id="desc">A suspicious message leads to Stop, then Check through a known separate route, then Report to a trusted adult. Do not reply or share passwords.</desc><rect width="480" height="320" fill="white"/><text x="240" y="32" font-family="Arial,sans-serif" font-size="24" fill="#153847" text-anchor="middle">Suspicious message?</text><rect x="90" y="55" width="300" height="48" rx="10" fill="#e8f5f1" stroke="#507d79"/><text x="240" y="85" font-family="Arial,sans-serif" font-size="18" fill="#153847" text-anchor="middle">STOP · do not click</text><path d="M240 103L240 128" fill="none" stroke="#167b79" stroke-width="2"/><polygon fill="#167b79" points="240,128 236.16459569116637,120.97933950487702 243.83540430883363,120.97933950487702"/><rect x="90" y="130" width="300" height="48" rx="10" fill="#e8f5f1" stroke="#507d79"/><text x="240" y="160" font-family="Arial,sans-serif" font-size="18" fill="#153847" text-anchor="middle">CHECK · known route</text><path d="M240 178L240 203" fill="none" stroke="#167b79" stroke-width="2"/><polygon fill="#167b79" points="240,203 236.16459569116637,195.97933950487703 243.83540430883363,195.97933950487703"/><rect x="90" y="205" width="300" height="48" rx="10" fill="#e8f5f1" stroke="#507d79"/><text x="240" y="235" font-family="Arial,sans-serif" font-size="18" fill="#153847" text-anchor="middle">REPORT · trusted adult</text><text x="240" y="288" font-family="Arial,sans-serif" font-size="16" fill="#153847" text-anchor="middle">Already clicked? Ask for help now.</text></svg>