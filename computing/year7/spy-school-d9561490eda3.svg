<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">Cell values and binary places</title><desc id="desc">Spreadsheet columns A and B: row 1 Agent and Clues; row 2 Amber and 3; row 3 Blue and 5; row 4 Coral and 4. B2:B4 is highlighted. Separate binary places 8,4,2,1 contain 0,1,0,1: decimal 5.</desc><rect width="480" height="320" fill="white"/><text x="48" y="74" font-family="Arial,sans-serif" font-size="16" fill="#153847" text-anchor="middle">1</text><text x="48" y="108" font-family="Arial,sans-serif" font-size="16" fill="#153847" text-anchor="middle">2</text><text x="48" y="142" font-family="Arial,sans-serif" font-size="16" fill="#153847" text-anchor="middle">3</text><text x="48" y="176" font-family="Arial,sans-serif" font-size="16" fill="#153847" text-anchor="middle">4</text><text x="175" y="40" font-family="Arial,sans-serif" font-size="18" fill="#153847" text-anchor="middle">A</text><text x="330" y="40" font-family="Arial,sans-serif" font-size="18" fill="#153847" text-anchor="middle">B</text><rect x="75" y="52" width="155" height="34" rx="10" fill="#fff" stroke="#507d79"/><text x="152.5" y="75" font-family="Arial,sans-serif" font-size="18" fill="#153847" text-anchor="middle">Agent</text><rect x="230" y="52" width="155" height="34" rx="10" fill="#fff" stroke="#507d79"/><text x="307.5" y="75" font-family="Arial,sans-serif" font-size="18" fill="#153847" text-anchor="middle">Clues</text><rect x="75" y="86" width="155" height="34" rx="10" fill="#fff" stroke="#507d79"/><text x="152.5" y="109" font-family="Arial,sans-serif" font-size="18" fill="#153847" text-anchor="middle">Amber</text><rect x="230" y="86" width="155" height="34" rx="10" fill="#d9f0e6" stroke="#507d79"/><text x="307.5" y="109" font-family="Arial,sans-serif" font-size="18" fill="#153847" text-anchor="middle">3</text><rect x="75" y="120" width="155" height="34" rx="10" fill="#fff" stroke="#507d79"/><text x="152.5" y="143" font-family="Arial,sans-serif" font-size="18" fill="#153847" text-anchor="middle">Blue</text><rect x="230" y="120" width="155" height="34" rx="10" fill="#d9f0e6" stroke="#507d79"/><text x="307.5" y="143" font-family="Arial,sans-serif" font-size="18" fill="#153847" text-anchor="middle">5</text><rect x="75" y="154" width="155" height="34" rx="10" fill="#fff" stroke="#507d79"/><text x="152.5" y="177" font-family="Arial,sans-serif" font-size="18" fill="#153847" text-anchor="middle">Coral</text><rect x="230" y="154" width="155" height="34" rx="10" fill="#d9f0e6" stroke="#507d79"/><text x="307.5" y="177" font-family="Arial,sans-serif" font-size="18" fill="#153847" text-anchor="middle">4</text><text x="240" y="225" font-family="Arial,sans-serif" font-size="18" fill="#153847" text-anchor="middle">Separate binary example:</text><text x="165" y="255" font-family="Arial,sans-serif" font-size="16" fill="#153847" text-anchor="middle">8</text><rect x="142" y="265" width="46" height="35" rx="10" fill="#e8f5f1" stroke="#507d79"/><text x="165" y="288.5" font-family="Arial,sans-serif" font-size="18" fill="#153847" text-anchor="middle">0</text><text x="215" y="255" font-family="Arial,sans-serif" font-size="16" fill="#153847" text-anchor="middle">4</text><rect x="192" y="265" width="46" height="35" rx="10" fill="#e8f5f1" stroke="#507d79"/><text x="215" y="288.5" font-family="Arial,sans-serif" font-size="18" fill="#153847" text-anchor="middle">1</text><text x="265" y="255" font-family="Arial,sans-serif" font-size="16" fill="#153847" text-anchor="middle">2</text><rect x="242" y="265" width="46" height="35" rx="10" fill="#e8f5f1" stroke="#507d79"/><text x="265" y="288.5" font-family="Arial,sans-serif" font-size="18" fill="#153847" text-anchor="middle">0</text><text x="315" y="255" font-family="Arial,sans-serif" font-size="16" fill="#153847" text-anchor="middle">1</text><rect x="292" y="265" width="46" height="35" rx="10" fill="#e8f5f1" stroke="#507d79"/><text x="315" y="288.5" fo