<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">Test the boundary</title><desc id="desc">At score 5, score greater than 5 is false, producing Keep going, which fails the rule. Score greater than or equal to 5 is true, producing Win, which passes. Build, test and improve.</desc><rect width="480" height="320" fill="white"/><text x="240" y="35" font-family="Arial,sans-serif" font-size="23" fill="#153847" text-anchor="middle">Rule: win at 5 points or more</text><text x="240" y="72" font-family="Arial,sans-serif" font-size="20" fill="#153847" text-anchor="middle">Test score = 5</text><rect x="20" y="95" width="210" height="46" rx="10" fill="#fff0ef" stroke="#507d79"/><text x="125" y="124" font-family="Arial,sans-serif" font-size="18" fill="#153847" text-anchor="middle">5 &gt; 5 is false</text><rect x="250" y="95" width="210" height="46" rx="10" fill="#e8f5f1" stroke="#507d79"/><text x="355" y="124" font-family="Arial,sans-serif" font-size="18" fill="#153847" text-anchor="middle">5 &gt;= 5 is true</text><path d="M125 141L125 170" fill="none" stroke="#167b79" stroke-width="2"/><polygon fill="#167b79" points="125,170 121.16459569116637,162.97933950487703 128.83540430883363,162.97933950487703"/><path d="M355 141L355 170" fill="none" stroke="#167b79" stroke-width="2"/><polygon fill="#167b79" points="355,170 351.16459569116637,162.97933950487703 358.83540430883363,162.97933950487703"/><rect x="20" y="172" width="210" height="46" rx="10" fill="#fff0ef" stroke="#507d79"/><text x="125" y="201" font-family="Arial,sans-serif" font-size="18" fill="#153847" text-anchor="middle">Keep going · FAIL</text><rect x="250" y="172" width="210" height="46" rx="10" fill="#e8f5f1" stroke="#507d79"/><text x="355" y="201" font-family="Arial,sans-serif" font-size="18" fill="#153847" text-anchor="middle">Win · PASS</text><text x="240" y="265" font-family="Arial,sans-serif" font-size="19" fill="#153847" text-anchor="middle">Build → Test → Improve → Test again</text><text x="240" y="297" font-family="Arial,sans-serif" font-size="16" fill="#153847" text-anchor="middle">Also test below and above the boundary.</text></svg>