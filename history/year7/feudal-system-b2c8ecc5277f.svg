<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Follow the exchange, not just a pyramid</title><desc id="desc">King grants land to a lord; Lord owes service to the king; One simplified arrangement. Read the accompanying explanation for meaning and limits.</desc><rect width="640" height="360" rx="18" fill="#f8fbfa"/><rect x="35" y="105" width="200" height="100" rx="14" fill="#e0f2ee" stroke="#9fcac2" stroke-width="2"/><rect x="405" y="105" width="200" height="100" rx="14" fill="#e0f2ee" stroke="#9fcac2" stroke-width="2"/><text x="135" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#173d4c">King</text><text x="505" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#173d4c">Lord</text><path d="M235 135H405m-8-7 8 7-8 7M405 180H235m8-7-8 7 8 7" fill="none" stroke="#217869" stroke-width="3"/><text x="320" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#173d4c">Land</text><text x="320" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#173d4c">Service</text><text x="320" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#173d4c">One simplified arrangement</text></svg>
