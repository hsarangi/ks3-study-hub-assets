<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Keep the September events in order</title><desc id="desc">25 September then 28 September then 14 October. Read the accompanying explanation for meaning and limits.</desc><rect width="640" height="360" rx="18" fill="#f8fbfa"/><path d="M70 170H570" stroke="#217869" stroke-width="5"/><circle cx="105" cy="170" r="9" fill="#217869"/><text x="105" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#173d4c">25 September</text><circle cx="320" cy="170" r="9" fill="#217869"/><text x="320" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#173d4c">28 September</text><circle cx="535" cy="170" r="9" fill="#217869"/><text x="535" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#173d4c">14 October</text><text x="320" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#173d4c">Order shown · not a time scale</text></svg>
