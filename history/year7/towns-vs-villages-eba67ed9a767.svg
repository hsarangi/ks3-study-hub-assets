<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Compare work and connections</title><desc id="desc">Village supplies food to town; Town supplies tools and goods to village; Examples of economic connections. Read the accompanying explanation for meaning and limits.</desc><rect width="640" height="360" rx="18" fill="#f8fbfa"/><rect x="25" y="115" width="190" height="100" rx="14" fill="#e0f2ee" stroke="#9fcac2" stroke-width="2"/><rect x="425" y="115" width="190" height="100" rx="14" fill="#e0f2ee" stroke="#9fcac2" stroke-width="2"/><text x="120" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#173d4c">Village</text><text x="520" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#173d4c">Town</text><path d="M215 145H425m-8-7 8 7-8 7M425 190H215m8-7-8 7 8 7" fill="none" stroke="#217869" stroke-width="3"/><text x="320" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#173d4c">Food</text><text x="320" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#173d4c">Tools and goods</text><text x="320" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#173d4c">Examples of connections</text></svg>
