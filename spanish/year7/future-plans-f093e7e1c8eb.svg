<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Build ir + a + infinitive</title><desc id="desc">Mañana,; voy a; jugar al tenis.. Read the accompanying explanation for meaning and limits.</desc><rect width="640" height="360" rx="18" fill="#f8fbfa"/><rect x="50" y="25" width="540" height="76" rx="14" fill="#e0f2ee" stroke="#9fcac2" stroke-width="2"/><text x="320" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#173d4c">Mañana,</text><text x="320" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#173d4c">+</text><rect x="50" y="137" width="540" height="76" rx="14" fill="#fff1cc" stroke="#9fcac2" stroke-width="2"/><text x="320" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#173d4c">voy a</text><text x="320" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#173d4c">+</text><rect x="50" y="249" width="540" height="76" rx="14" fill="#e0f2ee" stroke="#9fcac2" stroke-width="2"/><text x="320" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#173d4c">jugar al tenis.</text></svg>
