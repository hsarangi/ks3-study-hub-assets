<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">Follow pollen to the ovule</title><desc id="desc">In this flower schematic, anthers make pollen. Pollination moves pollen to a stigma. A pollen tube grows down the style to an ovule in the ovary; fertilisation happens there.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f76"/></marker></defs><rect width="480" height="320" fill="#fff"/><g font-family="Arial, sans-serif"><ellipse cx="240" cy="146" rx="103" ry="47" fill="#f9d4dd" stroke="#a75277" stroke-width="3"/><ellipse cx="240" cy="146" rx="46" ry="104" fill="#f9d4dd" stroke="#a75277" stroke-width="3"/><line x1="190" y1="153" x2="180" y2="87" stroke="#17354a" stroke-width="3" /><line x1="290" y1="153" x2="300" y2="87" stroke="#17354a" stroke-width="3" /><ellipse cx="180" cy="81" rx="19" ry="9" fill="#eac263" stroke="#b45113" stroke-width="3"/><ellipse cx="300" cy="81" rx="19" ry="9" fill="#eac263" stroke="#b45113" stroke-width="3"/><line x1="240" y1="95" x2="240" y2="192" stroke="#087f76" stroke-width="3" /><ellipse cx="240" cy="87" rx="26" ry="10" fill="#88bc9a" stroke="#087f76" stroke-width="3"/><ellipse cx="240" cy="208" rx="37" ry="27" fill="#d8edc2" stroke="#087f76" stroke-width="3"/><circle cx="240" cy="208" r="10" fill="#ecd393" stroke="#17354a" stroke-width="2"/><path d="M240 92V205" fill="none" stroke="#b45113" stroke-width="3" stroke-dasharray="5 4"/><line x1="183" y1="64" x2="215.00330695646517" y2="64.69572406427098" stroke="#087f76" stroke-width="3" /><polygon points="229,65 214.87290298400987,70.69430679721447 215.13371092892046,58.69714133132748" fill="#087f76"/><text x="74" y="80" font-size="19" fill="#17354a" text-anchor="middle">Anther</text><line x1="112" y1="78" x2="157" y2="80" stroke="#17354a" stroke-width="3" /><text x="389" y="80" font-size="19" fill="#17354a" text-anchor="middle">Stigma</text><line x1="353" y1="78" x2="268" y2="86" stroke="#17354a" stroke-width="3" /><text x="390" y="146" font-size="19" fill="#17354a" text-anchor="middle">Style</text><line x1="360" y1="145" x2="244" y2="145" stroke="#17354a" stroke-width="3" /><text x="72" y="213" font-size="19" fill="#17354a" text-anchor="middle">Ovule</text><line x1="104" y1="210" x2="225" y2="208" stroke="#17354a" stroke-width="3" /><text x="388" y="224" font-size="19" fill="#17354a" text-anchor="middle">Ovary</text><line x1="355" y1="220" x2="279" y2="213" stroke="#17354a" stroke-width="3" /><text x="240" y="300" font-size="18" fill="#17354a" text-anchor="middle">Pollen transfer happens before fertilisation</text></g></svg>
