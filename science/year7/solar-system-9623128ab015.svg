<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">Eight planets in order from the Sun</title><desc id="desc">Two rows continue one sequence: Sun, Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune. Distances, sizes and spacing are deliberately not to scale.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f76"/></marker></defs><rect width="480" height="320" fill="#fff"/><g font-family="Arial, sans-serif"><circle cx="37" cy="60" r="23" fill="#f6d16c" stroke="#b45113" stroke-width="2"/><text x="37" y="104" font-size="18" fill="#17354a" text-anchor="middle">Sun</text><circle cx="119" cy="60" r="13" fill="#b9b9b9" stroke="#17354a" stroke-width="2"/><text x="119" y="145" font-size="17" fill="#17354a" text-anchor="middle">Mercury</text><circle cx="220" cy="60" r="13" fill="#d7ba83" stroke="#17354a" stroke-width="2"/><text x="220" y="145" font-size="17" fill="#17354a" text-anchor="middle">Venus</text><circle cx="321" cy="60" r="13" fill="#77b9d5" stroke="#17354a" stroke-width="2"/><text x="321" y="145" font-size="17" fill="#17354a" text-anchor="middle">Earth</text><circle cx="422" cy="60" r="13" fill="#d78768" stroke="#17354a" stroke-width="2"/><text x="422" y="145" font-size="17" fill="#17354a" text-anchor="middle">Mars</text><line x1="68" y1="60" x2="83" y2="60" stroke="#087f76" stroke-width="3" /><polygon points="97,60 83,66 83,54" fill="#087f76"/><line x1="145" y1="60" x2="178" y2="60" stroke="#087f76" stroke-width="3" /><polygon points="192,60 178,66 178,54" fill="#087f76"/><line x1="247" y1="60" x2="279" y2="60" stroke="#087f76" stroke-width="3" /><polygon points="293,60 279,66 279,54" fill="#087f76"/><line x1="348" y1="60" x2="381" y2="60" stroke="#087f76" stroke-width="3" /><polygon points="395,60 381,66 381,54" fill="#087f76"/><path d="M444 84V177H53V188" fill="none" stroke="#087f76" stroke-width="3" /><line x1="53" y1="188" x2="53" y2="193" stroke="#087f76" stroke-width="3" /><polygon points="53,207 47,193 59,193" fill="#087f76"/><circle cx="53" cy="229" r="17" fill="#d9b79b" stroke="#17354a" stroke-width="2"/><text x="53" y="275" font-size="18" fill="#17354a" text-anchor="middle">Jupiter</text><circle cx="177" cy="229" r="17" fill="#dac798" stroke="#17354a" stroke-width="2"/><ellipse cx="177" cy="229" rx="31" ry="7" fill="none" stroke="#b45113" stroke-width="3"/><text x="177" y="275" font-size="18" fill="#17354a" text-anchor="middle">Saturn</text><circle cx="301" cy="229" r="17" fill="#9bd6dc" stroke="#17354a" stroke-width="2"/><text x="301" y="275" font-size="18" fill="#17354a" text-anchor="middle">Uranus</text><circle cx="425" cy="229" r="17" fill="#688bcf" stroke="#17354a" stroke-width="2"/><text x="425" y="275" font-size="18" fill="#17354a" text-anchor="middle">Neptune</text><line x1="85" y1="229" x2="128" y2="229" stroke="#087f76" stroke-width="3" /><polygon points="142,229 128,235 128,223" fill="#087f76"/><line x1="211" y1="229" x2="253" y2="229" stroke="#087f76" stroke-width="3" /><polygon points="267,229 253,235 253,223" fill="#087f76"/><line x1="334" y1="229" x2="376" y2="229" stroke="#087f76" stroke-width="3" /><polygon points="390,229 376,235 376,223" fill="#087f76"/><text x="240" y="312" font-size="17" fill="#17354a" text-anchor="middle">Sizes and distances not to scale</text></g></svg>
