<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">Fertilisation is not implantation</title><desc id="desc">Sperm and egg fuse in an oviduct to form a zygote. As cells divide the early embryo moves to the uterus. It implants in the lining and develops during gestation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f76"/></marker></defs><rect width="480" height="320" fill="#fff"/><g font-family="Arial, sans-serif"><circle cx="59" cy="64" r="9" fill="#b7d4ed" stroke="#17354a" stroke-width="2"/><path d="M50 65Q30 45 12 70" fill="none" stroke="#17354a" stroke-width="3" /><circle cx="105" cy="65" r="21" fill="#efd09f" stroke="#17354a" stroke-width="2"/><line x1="140" y1="65" x2="188" y2="65" stroke="#087f76" stroke-width="3" /><polygon points="202,65 188,71 188,59" fill="#087f76"/><circle cx="235" cy="65" r="27" fill="#c7b7ed" stroke="#17354a" stroke-width="2"/><text x="87" y="119" font-size="18" fill="#17354a" text-anchor="middle">Gametes</text><text x="235" y="119" font-size="18" fill="#17354a" text-anchor="middle">Zygote</text><line x1="270" y1="65" x2="330" y2="65" stroke="#087f76" stroke-width="3" /><polygon points="344,65 330,71 330,59" fill="#087f76"/><circle cx="380" cy="54" r="13" fill="#c7b7ed" stroke="#17354a" stroke-width="2"/><circle cx="402" cy="54" r="13" fill="#c7b7ed" stroke="#17354a" stroke-width="2"/><circle cx="380" cy="76" r="13" fill="#c7b7ed" stroke="#17354a" stroke-width="2"/><circle cx="402" cy="76" r="13" fill="#c7b7ed" stroke="#17354a" stroke-width="2"/><text x="390" y="119" font-size="18" fill="#17354a" text-anchor="middle">Cell division</text><line x1="390" y1="145" x2="390" y2="194" stroke="#087f76" stroke-width="3" /><polygon points="390,208 384,194 396,194" fill="#087f76"/><rect x="277" y="222" width="180" height="50" rx="12" fill="#e8f5f2" stroke="#087f76" stroke-width="2"/><text x="367" y="253" font-size="18" fill="#17354a" text-anchor="middle">Implantation</text><line x1="265" y1="247" x2="213" y2="247" stroke="#087f76" stroke-width="3" /><polygon points="199,247 213,241 213,253" fill="#087f76"/><rect x="20" y="222" width="165" height="50" rx="12" fill="#e8f5f2" stroke="#087f76" stroke-width="2"/><text x="102.5" y="253" font-size="18" fill="#17354a" text-anchor="middle">Development</text><text x="240" y="182" font-size="19" fill="#17354a" text-anchor="middle">Oviduct → uterus</text></g></svg>
