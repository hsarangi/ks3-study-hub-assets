<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">Shape helps a cell do its job</title><desc id="desc">A red blood cell is a biconcave disc; a nerve cell has a long axon; a root hair cell has a long extension. These adaptations support oxygen transport, signalling and water uptake.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f76"/></marker></defs><rect width="480" height="320" fill="#fff"/><g font-family="Arial, sans-serif"><text x="85" y="37" font-size="18" fill="#17354a" text-anchor="middle">Red blood cell</text><ellipse cx="85" cy="125" rx="55" ry="36" fill="#f2a8ae" stroke="#a52f49" stroke-width="3"/><ellipse cx="85" cy="125" rx="28" ry="14" fill="#f9d0d3" stroke="#a52f49" stroke-width="3"/><text x="85" y="218" font-size="19" fill="#17354a" text-anchor="middle">Oxygen</text><text x="250" y="37" font-size="18" fill="#17354a" text-anchor="middle">Nerve cell</text><circle cx="213" cy="120" r="21" fill="#c7b7ed" stroke="#17354a" stroke-width="2"/><line x1="235" y1="120" x2="310" y2="120" stroke="#17354a" stroke-width="3" /><line x1="205" y1="120" x2="190" y2="85" stroke="#17354a" stroke-width="3" /><line x1="205" y1="120" x2="173" y2="108" stroke="#17354a" stroke-width="3" /><line x1="205" y1="120" x2="177" y2="147" stroke="#17354a" stroke-width="3" /><text x="250" y="218" font-size="19" fill="#17354a" text-anchor="middle">Signals</text><text x="400" y="37" font-size="18" fill="#17354a" text-anchor="middle">Root hair cell</text><path d="M355 95H407V114H455V129H407V155H355Z" fill="#d9edc9" stroke="#087f76" stroke-width="3" /><circle cx="375" cy="125" r="10" fill="#c7b7ed" stroke="#17354a" stroke-width="2"/><text x="400" y="218" font-size="19" fill="#17354a" text-anchor="middle">Water uptake</text><text x="240" y="280" font-size="19" fill="#17354a" text-anchor="middle">Different structures, different functions</text></g></svg>
