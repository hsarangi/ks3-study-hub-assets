<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">Light must reach your eye</title><desc id="desc">Light travels from a source to an object, then reflected light enters an eye. The eye receives light; it does not send a seeing ray towards the object.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f76"/></marker></defs><rect width="480" height="320" fill="#fff"/><g font-family="Arial, sans-serif"><circle cx="55" cy="74" r="25" fill="#f6d16c" stroke="#b45113" stroke-width="2"/><line x1="87" y1="74" x2="98" y2="74" stroke="#b45113" stroke-width="3" /><line x1="77.62741699796952" y1="96.62741699796952" x2="85.40559159102155" y2="104.40559159102153" stroke="#b45113" stroke-width="3" /><line x1="55" y1="106" x2="55" y2="117" stroke="#b45113" stroke-width="3" /><line x1="32.37258300203048" y1="96.62741699796952" x2="24.59440840897846" y2="104.40559159102155" stroke="#b45113" stroke-width="3" /><line x1="23" y1="74" x2="12" y2="74" stroke="#b45113" stroke-width="3" /><line x1="32.372583002030474" y1="51.37258300203048" x2="24.59440840897845" y2="43.59440840897846" stroke="#b45113" stroke-width="3" /><line x1="54.99999999999999" y1="42" x2="54.99999999999999" y2="31" stroke="#b45113" stroke-width="3" /><line x1="77.62741699796952" y1="51.372583002030474" x2="85.40559159102153" y2="43.59440840897845" stroke="#b45113" stroke-width="3" /><rect x="210" y="158" width="60" height="60" rx="12" fill="#dda884" stroke="#b45113" stroke-width="2"/><path d="M375 85Q408 50 447 85Q408 120 375 85Z" fill="#fff" stroke="#1869b2" stroke-width="3" /><circle cx="410" cy="85" r="10" fill="#1869b2" stroke="#17354a" stroke-width="2"/><line x1="92" y1="92" x2="194.49294432076786" y2="163.02581229246192" stroke="#087f76" stroke-width="3" /><polygon points="206,171 191.07543530325154,167.9574075835614 197.91045333828419,158.09421700136244" fill="#087f76"/><line x1="274" y1="171" x2="365.5778371139984" y2="106.09531932697203" stroke="#087f76" stroke-width="3" /><polygon points="377,98 369.04725968270066,110.9905319924013 362.1084145452961,101.20010666154276" fill="#087f76"/><text x="55" y="143" font-size="18" fill="#17354a" text-anchor="middle">Source</text><text x="240" y="255" font-size="20" fill="#17354a" text-anchor="middle">Object</text><text x="410" y="145" font-size="20" fill="#17354a" text-anchor="middle">Eye</text><text x="240" y="303" font-size="21" fill="#17354a" text-anchor="middle">Source → object → eye</text></g></svg>
