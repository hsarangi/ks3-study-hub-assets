<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">Compare facing poles</title><desc id="desc">In the first pair the facing poles are south and north, so arrows point towards each other. In the second pair both facing poles are south, so arrows point apart.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f76"/></marker></defs><rect width="480" height="320" fill="#fff"/><g font-family="Arial, sans-serif"><text x="240" y="28" font-size="20" fill="#17354a" text-anchor="middle">Opposite poles attract</text><rect x="30" y="50" width="140" height="45" rx="12" fill="#dceaf8" stroke="#1869b2" stroke-width="2"/><rect x="310" y="50" width="140" height="45" rx="12" fill="#f6d7db" stroke="#a52f49" stroke-width="2"/><text x="55" y="80" font-size="20" fill="#17354a" text-anchor="middle">N</text><text x="145" y="80" font-size="20" fill="#17354a" text-anchor="middle">S</text><text x="335" y="80" font-size="20" fill="#17354a" text-anchor="middle">N</text><text x="425" y="80" font-size="20" fill="#17354a" text-anchor="middle">S</text><line x1="185" y1="74" x2="209" y2="74" stroke="#087f76" stroke-width="3" /><polygon points="223,74 209,80 209,68" fill="#087f76"/><line x1="295" y1="74" x2="271" y2="74" stroke="#087f76" stroke-width="3" /><polygon points="257,74 271,68 271,80" fill="#087f76"/><text x="240" y="173" font-size="20" fill="#17354a" text-anchor="middle">Like poles repel</text><rect x="30" y="200" width="140" height="45" rx="12" fill="#dceaf8" stroke="#1869b2" stroke-width="2"/><rect x="310" y="200" width="140" height="45" rx="12" fill="#f6d7db" stroke="#a52f49" stroke-width="2"/><text x="55" y="230" font-size="20" fill="#17354a" text-anchor="middle">N</text><text x="145" y="230" font-size="20" fill="#17354a" text-anchor="middle">S</text><text x="335" y="230" font-size="20" fill="#17354a" text-anchor="middle">S</text><text x="425" y="230" font-size="20" fill="#17354a" text-anchor="middle">N</text><line x1="225" y1="223" x2="197" y2="223" stroke="#087f76" stroke-width="3" /><polygon points="183,223 197,217 197,229" fill="#087f76"/><line x1="255" y1="223" x2="283" y2="223" stroke="#087f76" stroke-width="3" /><polygon points="297,223 283,229 283,217" fill="#087f76"/><text x="240" y="293" font-size="18" fill="#17354a" text-anchor="middle">Arrows show forces on the magnets</text></g></svg>
