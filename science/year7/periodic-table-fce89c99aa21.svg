<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">Read an element tile</title><desc id="desc">A sample of four element tiles shows atomic number, chemical symbol and name. This is not their layout in the full periodic table. A symbol begins with a capital letter; a second letter is lower case.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f76"/></marker></defs><rect width="480" height="320" fill="#fff"/><g font-family="Arial, sans-serif"><rect x="20" y="35" width="200" height="125" rx="12" fill="#edf6fa" stroke="#1869b2" stroke-width="2"/><text x="40" y="63" font-size="20" fill="#17354a" text-anchor="start">1</text><text x="120" y="100" font-size="34" fill="#1869b2" text-anchor="middle">H</text><text x="120" y="138" font-size="20" fill="#17354a" text-anchor="middle">Hydrogen</text><rect x="260" y="35" width="200" height="125" rx="12" fill="#edf6fa" stroke="#1869b2" stroke-width="2"/><text x="280" y="63" font-size="20" fill="#17354a" text-anchor="start">6</text><text x="360" y="100" font-size="34" fill="#1869b2" text-anchor="middle">C</text><text x="360" y="138" font-size="20" fill="#17354a" text-anchor="middle">Carbon</text><rect x="20" y="180" width="200" height="125" rx="12" fill="#edf6fa" stroke="#1869b2" stroke-width="2"/><text x="40" y="208" font-size="20" fill="#17354a" text-anchor="start">8</text><text x="120" y="245" font-size="34" fill="#1869b2" text-anchor="middle">O</text><text x="120" y="283" font-size="20" fill="#17354a" text-anchor="middle">Oxygen</text><rect x="260" y="180" width="200" height="125" rx="12" fill="#edf6fa" stroke="#1869b2" stroke-width="2"/><text x="280" y="208" font-size="20" fill="#17354a" text-anchor="start">11</text><text x="360" y="245" font-size="34" fill="#1869b2" text-anchor="middle">Na</text><text x="360" y="283" font-size="20" fill="#17354a" text-anchor="middle">Sodium</text></g></svg>
