<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">Compare two typical cells</title><desc id="desc">An animal cell has an outer membrane and nucleus. A leaf cell has a wall outside its membrane, a large vacuole and chloroplasts. Both contain cytoplasm and mitochondria.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f76"/></marker></defs><rect width="480" height="320" fill="#fff"/><g font-family="Arial, sans-serif"><text x="120" y="30" font-size="20" fill="#17354a" text-anchor="middle">Animal cell</text><text x="355" y="30" font-size="20" fill="#17354a" text-anchor="middle">Leaf cell</text><ellipse cx="120" cy="133" rx="76" ry="70" fill="#e8f2fc" stroke="#087f76" stroke-width="3"/><circle cx="113" cy="122" r="19" fill="#c7b7ed" stroke="#17354a" stroke-width="2"/><ellipse cx="150" cy="160" rx="13" ry="7" fill="#f8c891" stroke="#087f76" stroke-width="3"/><rect x="275" y="62" width="160" height="144" rx="12" fill="#e4efc9" stroke="#087f76" stroke-width="2"/><rect x="281" y="68" width="148" height="132" rx="12" fill="#edf7ed" stroke="#087f76" stroke-width="2"/><rect x="320" y="88" width="84" height="80" rx="12" fill="#dbf0fd" stroke="#1869b2" stroke-width="2"/><circle cx="303" cy="178" r="14" fill="#c7b7ed" stroke="#17354a" stroke-width="2"/><ellipse cx="300" cy="95" rx="12" ry="7" fill="#84be67" stroke="#087f76" stroke-width="3"/><ellipse cx="415" cy="182" rx="10" ry="6" fill="#84be67" stroke="#087f76" stroke-width="3"/><ellipse cx="355" cy="184" rx="12" ry="6" fill="#f8c891" stroke="#087f76" stroke-width="3"/><line x1="55" y1="100" x2="30" y2="75" stroke="#17354a" stroke-width="3" /><text x="20" y="61" font-size="17" fill="#17354a" text-anchor="start">Membrane</text><line x1="431" y1="97" x2="451" y2="58" stroke="#17354a" stroke-width="3" /><text x="449" y="45" font-size="17" fill="#17354a" text-anchor="middle">Wall</text><text x="120" y="245" font-size="18" fill="#17354a" text-anchor="middle">Nucleus + cytoplasm</text><text x="355" y="245" font-size="18" fill="#17354a" text-anchor="middle">Vacuole + chloroplasts</text><text x="240" y="285" font-size="18" fill="#17354a" text-anchor="middle">Simplified models, not to scale</text></g></svg>
