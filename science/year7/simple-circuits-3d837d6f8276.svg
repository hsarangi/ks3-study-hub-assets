<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">A complete loop lets current flow</title><desc id="desc">A closed series circuit contains a cell, wires and a lamp. The cell symbol has unequal parallel lines; the lamp is a circle with a cross. The complete path has no gap.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f76"/></marker></defs><rect width="480" height="320" fill="#fff"/><g font-family="Arial, sans-serif"><path d="M195 70H70V240H410V70H280" fill="none" stroke="#17354a" stroke-width="3" /><line x1="220" y1="45" x2="220" y2="95" stroke="#17354a" stroke-width="3" /><line x1="244" y1="55" x2="244" y2="85" stroke="#17354a" stroke-width="3" /><line x1="195" y1="70" x2="220" y2="70" stroke="#17354a" stroke-width="3" /><line x1="244" y1="70" x2="280" y2="70" stroke="#17354a" stroke-width="3" /><circle cx="240" cy="240" r="26" fill="#fff6d7" stroke="#b45113" stroke-width="2"/><line x1="222" y1="222" x2="258" y2="258" stroke="#b45113" stroke-width="3" /><line x1="222" y1="258" x2="258" y2="222" stroke="#b45113" stroke-width="3" /><text x="240" y="27" font-size="20" fill="#17354a" text-anchor="middle">Cell</text><text x="240" y="302" font-size="20" fill="#17354a" text-anchor="middle">Lamp</text><text x="92" y="156" font-size="20" fill="#17354a" text-anchor="start">Wire</text></g></svg>
