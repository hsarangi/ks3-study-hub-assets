<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">Bonded together or simply mixed?</title><desc id="desc">The compound sample contains water molecules: each has two hydrogen atoms bonded to one oxygen. The mixture sample contains separate hydrogen and oxygen molecules. Lines represent bonds within molecules.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f76"/></marker></defs><rect width="480" height="320" fill="#fff"/><g font-family="Arial, sans-serif"><rect x="18" y="60" width="210" height="170" rx="12" fill="#f7fbfd" stroke="#1869b2" stroke-width="2"/><rect x="252" y="60" width="210" height="170" rx="12" fill="#f7fbfd" stroke="#1869b2" stroke-width="2"/><line x1="77" y1="115" x2="52" y2="137" stroke="#17354a" stroke-width="3" /><line x1="77" y1="115" x2="102" y2="137" stroke="#17354a" stroke-width="3" /><circle cx="77" cy="115" r="18" fill="#f1bbc5" stroke="#17354a" stroke-width="2"/><text x="77" y="121" font-size="17" fill="#17354a" text-anchor="middle">O</text><circle cx="52" cy="137" r="12" fill="#d2e5f7" stroke="#17354a" stroke-width="2"/><text x="52" y="143" font-size="17" fill="#17354a" text-anchor="middle">H</text><circle cx="102" cy="137" r="12" fill="#d2e5f7" stroke="#17354a" stroke-width="2"/><text x="102" y="143" font-size="17" fill="#17354a" text-anchor="middle">H</text><line x1="169" y1="175" x2="144" y2="197" stroke="#17354a" stroke-width="3" /><line x1="169" y1="175" x2="194" y2="197" stroke="#17354a" stroke-width="3" /><circle cx="169" cy="175" r="18" fill="#f1bbc5" stroke="#17354a" stroke-width="2"/><text x="169" y="181" font-size="17" fill="#17354a" text-anchor="middle">O</text><circle cx="144" cy="197" r="12" fill="#d2e5f7" stroke="#17354a" stroke-width="2"/><text x="144" y="203" font-size="17" fill="#17354a" text-anchor="middle">H</text><circle cx="194" cy="197" r="12" fill="#d2e5f7" stroke="#17354a" stroke-width="2"/><text x="194" y="203" font-size="17" fill="#17354a" text-anchor="middle">H</text><line x1="285" y1="100" x2="312" y2="100" stroke="#17354a" stroke-width="3" /><circle cx="285" cy="100" r="12" fill="#d2e5f7" stroke="#17354a" stroke-width="2"/><text x="285" y="106" font-size="17" fill="#17354a" text-anchor="middle">H</text><circle cx="312" cy="100" r="12" fill="#d2e5f7" stroke="#17354a" stroke-width="2"/><text x="312" y="106" font-size="17" fill="#17354a" text-anchor="middle">H</text><line x1="380" y1="170" x2="418" y2="170" stroke="#17354a" stroke-width="3" /><circle cx="380" cy="170" r="18" fill="#f1bbc5" stroke="#17354a" stroke-width="2"/><text x="380" y="176" font-size="17" fill="#17354a" text-anchor="middle">O</text><circle cx="418" cy="170" r="18" fill="#f1bbc5" stroke="#17354a" stroke-width="2"/><text x="418" y="176" font-size="17" fill="#17354a" text-anchor="middle">O</text><line x1="285" y1="190" x2="312" y2="190" stroke="#17354a" stroke-width="3" /><circle cx="285" cy="190" r="12" fill="#d2e5f7" stroke="#17354a" stroke-width="2"/><text x="285" y="196" font-size="17" fill="#17354a" text-anchor="middle">H</text><circle cx="312" cy="190" r="12" fill="#d2e5f7" stroke="#17354a" stroke-width="2"/><text x="312" y="196" font-size="17" fill="#17354a" text-anchor="middle">H</text><text x="123" y="35" font-size="20" fill="#17354a" text-anchor="middle">Compound</text><text x="357" y="35" font-size="20" fill="#17354a" text-anchor="middle">Mixture</text><text x="123" y="270" font-size="18" fill="#17354a" text-anchor="middle">Water molecules</text><text x="357" y="270" font-size="18" fill="#17354a" text-anchor="middle">Hydrogen + oxygen</text></g></svg>
