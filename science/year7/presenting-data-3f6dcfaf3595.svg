<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">Plot a continuous variable with units</title><desc id="desc">Illustrative results for dissolving: at 20 degrees Celsius, 80 seconds; at 40, 50; at 60, 30. Temperature is on x, time on y. The plotted points are joined to show this example trend, not a universal law.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f76"/></marker></defs><rect width="480" height="320" fill="#fff"/><g font-family="Arial, sans-serif"><line x1="65" y1="35" x2="65" y2="240" stroke="#17354a" stroke-width="3" /><line x1="65" y1="240" x2="425" y2="240" stroke="#17354a" stroke-width="3" /><line x1="59" y1="240" x2="65" y2="240" stroke="#17354a" stroke-width="3" /><text x="50" y="246" font-size="18" fill="#17354a" text-anchor="end">0</text><line x1="59" y1="160" x2="65" y2="160" stroke="#17354a" stroke-width="3" /><text x="50" y="166" font-size="18" fill="#17354a" text-anchor="end">40</text><line x1="59" y1="80" x2="65" y2="80" stroke="#17354a" stroke-width="3" /><text x="50" y="86" font-size="18" fill="#17354a" text-anchor="end">80</text><line x1="65" y1="240" x2="65" y2="247" stroke="#17354a" stroke-width="3" /><text x="65" y="272" font-size="18" fill="#17354a" text-anchor="middle">20</text><line x1="225" y1="240" x2="225" y2="247" stroke="#17354a" stroke-width="3" /><text x="225" y="272" font-size="18" fill="#17354a" text-anchor="middle">40</text><line x1="385" y1="240" x2="385" y2="247" stroke="#17354a" stroke-width="3" /><text x="385" y="272" font-size="18" fill="#17354a" text-anchor="middle">60</text><path d="M65 80L225 140L385 180" fill="none" stroke="#087f76" stroke-width="3" /><circle cx="65" cy="80" r="6" fill="#087f76" stroke="#17354a" stroke-width="2"/><circle cx="225" cy="140" r="6" fill="#087f76" stroke="#17354a" stroke-width="2"/><circle cx="385" cy="180" r="6" fill="#087f76" stroke="#17354a" stroke-width="2"/><text x="240" y="27" font-size="20" fill="#17354a" text-anchor="middle">Dissolving time (s)</text><text x="250" y="309" font-size="20" fill="#17354a" text-anchor="middle">Water temperature (°C)</text></g></svg>
