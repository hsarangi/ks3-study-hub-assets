<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">Protect eyes from splashes</title><desc id="desc">A pair of splash goggles has two protective lenses and a surrounding frame. Nearby droplets illustrate a splash risk. The drawing is a reminder to wear the eye protection specified by a teacher; it is not a chemical hazard pictogram.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f76"/></marker></defs><rect width="480" height="320" fill="#fff"/><g font-family="Arial, sans-serif"><rect x="75" y="98" width="300" height="113" rx="12" fill="#e5f1f9" stroke="#1869b2" stroke-width="2"/><rect x="94" y="117" width="108" height="72" rx="12" fill="#fff" stroke="#1869b2" stroke-width="2"/><rect x="248" y="117" width="108" height="72" rx="12" fill="#fff" stroke="#1869b2" stroke-width="2"/><line x1="202" y1="150" x2="248" y2="150" stroke="#1869b2" stroke-width="3" /><line x1="75" y1="130" x2="38" y2="130" stroke="#1869b2" stroke-width="3" /><line x1="375" y1="130" x2="412" y2="130" stroke="#1869b2" stroke-width="3" /><path d="M150 37Q131 60 150 63Q168 60 150 37Z" fill="#73b8e0" stroke="#1869b2" stroke-width="3" /><path d="M312 37Q293 60 312 63Q330 60 312 37Z" fill="#73b8e0" stroke="#1869b2" stroke-width="3" /><line x1="150" y1="70" x2="150" y2="77" stroke="#087f76" stroke-width="3" /><polygon points="150,91 144,77 156,77" fill="#087f76"/><line x1="312" y1="70" x2="312" y2="77" stroke="#087f76" stroke-width="3" /><polygon points="312,91 306,77 318,77" fill="#087f76"/><text x="240" y="28" font-size="20" fill="#17354a" text-anchor="middle">Splash risk</text><text x="240" y="254" font-size="22" fill="#17354a" text-anchor="middle">Splash goggles</text><text x="240" y="299" font-size="18" fill="#17354a" text-anchor="middle">Use the protection your teacher specifies</text></g></svg>
