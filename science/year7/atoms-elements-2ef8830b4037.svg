<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">An element contains one type of atom</title><desc id="desc">Each carbon circle represents a carbon atom. Two joined oxygen circles represent an oxygen molecule. Both samples are elements because each sample contains only one type of atom.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f76"/></marker></defs><rect width="480" height="320" fill="#fff"/><g font-family="Arial, sans-serif"><rect x="20" y="55" width="200" height="170" rx="12" fill="#f6f9fd" stroke="#1869b2" stroke-width="2"/><rect x="260" y="55" width="200" height="170" rx="12" fill="#f6f9fd" stroke="#1869b2" stroke-width="2"/><circle cx="65" cy="100" r="18" fill="#d7e2ef" stroke="#17354a" stroke-width="2"/><text x="65" y="106" font-size="18" fill="#17354a" text-anchor="middle">C</text><circle cx="165" cy="110" r="18" fill="#d7e2ef" stroke="#17354a" stroke-width="2"/><text x="165" y="116" font-size="18" fill="#17354a" text-anchor="middle">C</text><circle cx="90" cy="180" r="18" fill="#d7e2ef" stroke="#17354a" stroke-width="2"/><text x="90" y="186" font-size="18" fill="#17354a" text-anchor="middle">C</text><circle cx="175" cy="180" r="18" fill="#d7e2ef" stroke="#17354a" stroke-width="2"/><text x="175" y="186" font-size="18" fill="#17354a" text-anchor="middle">C</text><line x1="310" y1="110" x2="340" y2="110" stroke="#17354a" stroke-width="3" /><circle cx="310" cy="110" r="18" fill="#f0bec5" stroke="#17354a" stroke-width="2"/><circle cx="340" cy="110" r="18" fill="#f0bec5" stroke="#17354a" stroke-width="2"/><text x="310" y="116" font-size="18" fill="#17354a" text-anchor="middle">O</text><text x="340" y="116" font-size="18" fill="#17354a" text-anchor="middle">O</text><line x1="395" y1="165" x2="425" y2="165" stroke="#17354a" stroke-width="3" /><circle cx="395" cy="165" r="18" fill="#f0bec5" stroke="#17354a" stroke-width="2"/><circle cx="425" cy="165" r="18" fill="#f0bec5" stroke="#17354a" stroke-width="2"/><text x="395" y="171" font-size="18" fill="#17354a" text-anchor="middle">O</text><text x="425" y="171" font-size="18" fill="#17354a" text-anchor="middle">O</text><text x="120" y="267" font-size="20" fill="#17354a" text-anchor="middle">Carbon</text><text x="360" y="267" font-size="20" fill="#17354a" text-anchor="middle">Oxygen</text><text x="240" y="305" font-size="17" fill="#17354a" text-anchor="middle">Different elements, each with one atom type</text></g></svg>
