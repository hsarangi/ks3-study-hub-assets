<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">Where gametes are made</title><desc id="desc">A function diagram, not an anatomical map: testes produce sperm; ovaries produce egg cells. The uterus supports development after implantation. The vagina connects the cervix to the outside.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f76"/></marker></defs><rect width="480" height="320" fill="#fff"/><g font-family="Arial, sans-serif"><rect x="25" y="38" width="180" height="72" rx="12" fill="#e8f5f2" stroke="#087f76" stroke-width="2"/><text x="115" y="69" font-size="18" fill="#17354a" text-anchor="middle">Testes</text><text x="115" y="94" font-size="17" fill="#17354a" text-anchor="middle">produce sperm</text><rect x="275" y="38" width="180" height="72" rx="12" fill="#e8f5f2" stroke="#087f76" stroke-width="2"/><text x="365" y="69" font-size="18" fill="#17354a" text-anchor="middle">Ovaries</text><text x="365" y="94" font-size="17" fill="#17354a" text-anchor="middle">produce egg cells</text><line x1="115" y1="120" x2="115" y2="153" stroke="#087f76" stroke-width="3" /><polygon points="115,167 109,153 121,153" fill="#087f76"/><line x1="365" y1="120" x2="365" y2="153" stroke="#087f76" stroke-width="3" /><polygon points="365,167 359,153 371,153" fill="#087f76"/><rect x="25" y="180" width="180" height="72" rx="12" fill="#e8f5f2" stroke="#087f76" stroke-width="2"/><text x="115" y="211" font-size="18" fill="#17354a" text-anchor="middle">Male gamete</text><text x="115" y="236" font-size="17" fill="#17354a" text-anchor="middle">sperm cell</text><rect x="275" y="180" width="180" height="72" rx="12" fill="#e8f5f2" stroke="#087f76" stroke-width="2"/><text x="365" y="211" font-size="18" fill="#17354a" text-anchor="middle">Female gamete</text><text x="365" y="236" font-size="17" fill="#17354a" text-anchor="middle">egg cell</text><text x="240" y="294" font-size="18" fill="#17354a" text-anchor="middle">Function diagram, not anatomical positions</text></g></svg>
