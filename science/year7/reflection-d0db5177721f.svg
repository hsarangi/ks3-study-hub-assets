<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">Measure both angles from the normal</title><desc id="desc">A ray approaches a horizontal mirror from the upper left and leaves towards the upper right. Both rays are 45 degrees from the normal, which is perpendicular to the mirror.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f76"/></marker></defs><rect width="480" height="320" fill="#fff"/><g font-family="Arial, sans-serif"><line x1="40" y1="245" x2="440" y2="245" stroke="#1869b2" stroke-width="3" /><line x1="240" y1="245" x2="240" y2="55" stroke="#17354a" stroke-width="3" stroke-dasharray="7 6"/><line x1="90" y1="95" x2="227.10050506338834" y2="232.10050506338834" stroke="#087f76" stroke-width="3" /><polygon points="237,242 222.85786437626905,236.34314575050763 231.34314575050763,227.85786437626905" fill="#087f76"/><line x1="243" y1="242" x2="380.1005050633883" y2="104.89949493661166" stroke="#087f76" stroke-width="3" /><polygon points="390,95 384.3431457505076,109.14213562373095 375.85786437626905,100.65685424949237" fill="#087f76"/><path d="M205 210A50 50 0 0 1 240 195" fill="none" stroke="#17354a" stroke-width="3" /><path d="M240 195A50 50 0 0 1 275 210" fill="none" stroke="#17354a" stroke-width="3" /><text x="206" y="184" font-size="18" fill="#17354a" text-anchor="middle">45°</text><text x="276" y="184" font-size="18" fill="#17354a" text-anchor="middle">45°</text><text x="240" y="35" font-size="20" fill="#17354a" text-anchor="middle">Normal</text><text x="92" y="67" font-size="18" fill="#17354a" text-anchor="middle">Incoming ray</text><text x="387" y="67" font-size="18" fill="#17354a" text-anchor="middle">Reflected ray</text><text x="240" y="293" font-size="20" fill="#17354a" text-anchor="middle">Mirror</text></g></svg>
