<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">Follow a change of state</title><desc id="desc">The diagram shows solid to liquid by melting and liquid to gas by evaporation or boiling; cooling reverses these by freezing and condensation. Particle identity is unchanged.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f76"/></marker></defs><rect width="480" height="320" fill="#fff"/><g font-family="Arial, sans-serif"><rect x="12" y="130" width="125" height="50" rx="12" fill="#e8f5f2" stroke="#087f76" stroke-width="2"/><text x="74.5" y="161" font-size="18" fill="#17354a" text-anchor="middle">Solid</text><rect x="177" y="130" width="125" height="50" rx="12" fill="#e8f5f2" stroke="#087f76" stroke-width="2"/><text x="239.5" y="161" font-size="18" fill="#17354a" text-anchor="middle">Liquid</text><rect x="342" y="130" width="125" height="50" rx="12" fill="#e8f5f2" stroke="#087f76" stroke-width="2"/><text x="404.5" y="161" font-size="18" fill="#17354a" text-anchor="middle">Gas</text><line x1="90" y1="105" x2="216" y2="105" stroke="#087f76" stroke-width="3" /><polygon points="230,105 216,111 216,99" fill="#087f76"/><text x="160" y="78" font-size="18" fill="#17354a" text-anchor="middle">Melting</text><line x1="250" y1="105" x2="393" y2="105" stroke="#087f76" stroke-width="3" /><polygon points="407,105 393,111 393,99" fill="#087f76"/><text x="333" y="78" font-size="17" fill="#17354a" text-anchor="middle">Evaporation</text><text x="333" y="99" font-size="17" fill="#17354a" text-anchor="middle">/ boiling</text><line x1="230" y1="209" x2="104" y2="209" stroke="#087f76" stroke-width="3" /><polygon points="90,209 104,203 104,215" fill="#087f76"/><text x="160" y="243" font-size="18" fill="#17354a" text-anchor="middle">Freezing</text><line x1="407" y1="209" x2="264" y2="209" stroke="#087f76" stroke-width="3" /><polygon points="250,209 264,203 264,215" fill="#087f76"/><text x="330" y="243" font-size="17" fill="#17354a" text-anchor="middle">Condensation</text><text x="240" y="294" font-size="20" fill="#17354a" text-anchor="middle">No new substance is made</text></g></svg>
