<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">The visible lit part changes</title><desc id="desc">Four phase examples as seen from Earth: new Moon is dark, first quarter has the right half lit, full Moon has the whole visible disc lit, third quarter has the left half lit. Orientation is shown for a northern-hemisphere viewer.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f76"/></marker></defs><rect width="480" height="320" fill="#fff"/><g font-family="Arial, sans-serif"><circle cx="60" cy="123" r="42" fill="#33455a" stroke="#17354a" stroke-width="2"/><circle cx="180" cy="123" r="42" fill="#33455a" stroke="#17354a" stroke-width="2"/><circle cx="300" cy="123" r="42" fill="#33455a" stroke="#17354a" stroke-width="2"/><circle cx="420" cy="123" r="42" fill="#33455a" stroke="#17354a" stroke-width="2"/><path d="M180 81A42 42 0 0 1 180 165Z" fill="#fbefd0" stroke="#fbefd0" stroke-width="3" /><circle cx="300" cy="123" r="42" fill="#fbefd0" stroke="#17354a" stroke-width="2"/><path d="M420 81A42 42 0 0 0 420 165Z" fill="#fbefd0" stroke="#fbefd0" stroke-width="3" /><text x="60" y="207" font-size="20" fill="#17354a" text-anchor="middle">New</text><text x="180" y="207" font-size="20" fill="#17354a" text-anchor="middle">First</text><text x="180" y="232" font-size="18" fill="#17354a" text-anchor="middle">quarter</text><text x="300" y="207" font-size="20" fill="#17354a" text-anchor="middle">Full</text><text x="420" y="207" font-size="20" fill="#17354a" text-anchor="middle">Third</text><text x="420" y="232" font-size="18" fill="#17354a" text-anchor="middle">quarter</text><text x="240" y="288" font-size="18" fill="#17354a" text-anchor="middle">Selected phases, viewed from Earth</text></g></svg>
