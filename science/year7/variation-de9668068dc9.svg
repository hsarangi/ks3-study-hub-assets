<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">Traits can have different causes</title><desc id="desc">Blood group is an inherited example. A scar is environmental. Height commonly involves both genes and environment; these are not three separate kinds of organism.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f76"/></marker></defs><rect width="480" height="320" fill="#fff"/><g font-family="Arial, sans-serif"><circle cx="110" cy="110" r="68" fill="#e1ebfc" stroke="#1869b2" stroke-width="2"/><circle cx="240" cy="110" r="68" fill="#d2e8df" stroke="#087f76" stroke-width="2"/><circle cx="370" cy="110" r="68" fill="#fff0d8" stroke="#b45113" stroke-width="2"/><text x="110" y="109" font-size="20" fill="#17354a" text-anchor="middle">Genes</text><text x="240" y="109" font-size="20" fill="#17354a" text-anchor="middle">Both</text><text x="370" y="109" font-size="18" fill="#17354a" text-anchor="middle">Environment</text><text x="110" y="225" font-size="18" fill="#17354a" text-anchor="middle">Blood group</text><text x="240" y="225" font-size="18" fill="#17354a" text-anchor="middle">Height</text><text x="370" y="225" font-size="18" fill="#17354a" text-anchor="middle">A scar</text><text x="240" y="285" font-size="19" fill="#17354a" text-anchor="middle">Examples of influences on variation</text></g></svg>
