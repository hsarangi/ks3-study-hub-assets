<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">Arrows show energy transfer</title><desc id="desc">Grass is eaten by a rabbit; a fox may eat the rabbit. Arrows point from food to consumer, showing the direction of energy transfer. This is one simple chain in a larger food web.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f76"/></marker></defs><rect width="480" height="320" fill="#fff"/><g font-family="Arial, sans-serif"><path d="M60 174V107M60 153L40 128M60 147L81 116" fill="none" stroke="#087f76" stroke-width="3" /><text x="60" y="217" font-size="20" fill="#17354a" text-anchor="middle">Grass</text><text x="60" y="250" font-size="17" fill="#17354a" text-anchor="middle">Producer</text><ellipse cx="235" cy="148" rx="36" ry="23" fill="#dfdbd4" stroke="#087f76" stroke-width="3"/><ellipse cx="256" cy="121" rx="12" ry="26" fill="#dfdbd4" stroke="#087f76" stroke-width="3"/><circle cx="265" cy="139" r="15" fill="#dfdbd4" stroke="#17354a" stroke-width="2"/><text x="240" y="217" font-size="20" fill="#17354a" text-anchor="middle">Rabbit</text><text x="240" y="250" font-size="17" fill="#17354a" text-anchor="middle">Consumer</text><path d="M373 172L385 117L410 140L432 117L443 172Z" fill="#e7aa70" stroke="#b45113" stroke-width="3" /><text x="410" y="217" font-size="20" fill="#17354a" text-anchor="middle">Fox</text><text x="410" y="250" font-size="17" fill="#17354a" text-anchor="middle">Consumer</text><line x1="102" y1="145" x2="166" y2="145" stroke="#087f76" stroke-width="3" /><polygon points="180,145 166,151 166,139" fill="#087f76"/><line x1="292" y1="145" x2="343" y2="145" stroke="#087f76" stroke-width="3" /><polygon points="357,145 343,151 343,139" fill="#087f76"/><text x="240" y="55" font-size="22" fill="#17354a" text-anchor="middle">Food → consumer</text><text x="240" y="295" font-size="17" fill="#17354a" text-anchor="middle">A feeding relationship, not a size comparison</text></g></svg>
