<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">Plan a dissolving investigation</title><desc id="desc">Temperature is changed; dissolving time is measured. Water volume, sugar mass, grain size and stirring are controlled. This is a planning diagram, not instructions to heat water without supervision.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f76"/></marker></defs><rect width="480" height="320" fill="#fff"/><g font-family="Arial, sans-serif"><path d="M35 85V185Q65 205 95 185V85" fill="#e5f4fc" stroke="#1869b2" stroke-width="3" /><line x1="36" y1="126" x2="94" y2="126" stroke="#1869b2" stroke-width="3" /><text x="65" y="240" font-size="21" fill="#17354a" text-anchor="middle">20 °C</text><circle cx="65" cy="170" r="5" fill="#b2b2c7" stroke="#17354a" stroke-width="2"/><path d="M195 85V185Q225 205 255 185V85" fill="#e5f4fc" stroke="#1869b2" stroke-width="3" /><line x1="196" y1="126" x2="254" y2="126" stroke="#1869b2" stroke-width="3" /><text x="225" y="240" font-size="21" fill="#17354a" text-anchor="middle">40 °C</text><circle cx="225" cy="170" r="5" fill="#b2b2c7" stroke="#17354a" stroke-width="2"/><path d="M355 85V185Q385 205 415 185V85" fill="#e5f4fc" stroke="#1869b2" stroke-width="3" /><line x1="356" y1="126" x2="414" y2="126" stroke="#1869b2" stroke-width="3" /><text x="385" y="240" font-size="21" fill="#17354a" text-anchor="middle">60 °C</text><circle cx="385" cy="170" r="5" fill="#b2b2c7" stroke="#17354a" stroke-width="2"/><text x="240" y="31" font-size="21" fill="#17354a" text-anchor="middle">Change water temperature</text><text x="240" y="287" font-size="20" fill="#17354a" text-anchor="middle">Measure time taken to dissolve (s)</text></g></svg>
