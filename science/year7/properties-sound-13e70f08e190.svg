<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">A sound wave has compressions</title><desc id="desc">Closely spaced lines represent compressions in air, and wider spaces represent rarefactions. Air particles vibrate back and forth while the disturbance transfers energy along the wave.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f76"/></marker></defs><rect width="480" height="320" fill="#fff"/><g font-family="Arial, sans-serif"><line x1="45" y1="95" x2="45" y2="196" stroke="#1869b2" stroke-width="3" /><line x1="51" y1="95" x2="51" y2="196" stroke="#1869b2" stroke-width="3" /><line x1="57" y1="95" x2="57" y2="196" stroke="#1869b2" stroke-width="3" /><line x1="63" y1="95" x2="63" y2="196" stroke="#1869b2" stroke-width="3" /><line x1="69" y1="95" x2="69" y2="196" stroke="#1869b2" stroke-width="3" /><line x1="95" y1="95" x2="95" y2="196" stroke="#1869b2" stroke-width="3" /><line x1="125" y1="95" x2="125" y2="196" stroke="#1869b2" stroke-width="3" /><line x1="155" y1="95" x2="155" y2="196" stroke="#1869b2" stroke-width="3" /><line x1="181" y1="95" x2="181" y2="196" stroke="#1869b2" stroke-width="3" /><line x1="187" y1="95" x2="187" y2="196" stroke="#1869b2" stroke-width="3" /><line x1="193" y1="95" x2="193" y2="196" stroke="#1869b2" stroke-width="3" /><line x1="199" y1="95" x2="199" y2="196" stroke="#1869b2" stroke-width="3" /><line x1="205" y1="95" x2="205" y2="196" stroke="#1869b2" stroke-width="3" /><line x1="231" y1="95" x2="231" y2="196" stroke="#1869b2" stroke-width="3" /><line x1="261" y1="95" x2="261" y2="196" stroke="#1869b2" stroke-width="3" /><line x1="291" y1="95" x2="291" y2="196" stroke="#1869b2" stroke-width="3" /><line x1="317" y1="95" x2="317" y2="196" stroke="#1869b2" stroke-width="3" /><line x1="323" y1="95" x2="323" y2="196" stroke="#1869b2" stroke-width="3" /><line x1="329" y1="95" x2="329" y2="196" stroke="#1869b2" stroke-width="3" /><line x1="335" y1="95" x2="335" y2="196" stroke="#1869b2" stroke-width="3" /><line x1="341" y1="95" x2="341" y2="196" stroke="#1869b2" stroke-width="3" /><line x1="367" y1="95" x2="367" y2="196" stroke="#1869b2" stroke-width="3" /><line x1="397" y1="95" x2="397" y2="196" stroke="#1869b2" stroke-width="3" /><line x1="427" y1="95" x2="427" y2="196" stroke="#1869b2" stroke-width="3" /><line x1="55" y1="45" x2="406" y2="45" stroke="#087f76" stroke-width="3" /><polygon points="420,45 406,51 406,39" fill="#087f76"/><text x="240" y="29" font-size="20" fill="#17354a" text-anchor="middle">Wave travels</text><line x1="230" y1="242" x2="194" y2="242" stroke="#087f76" stroke-width="3" /><polygon points="180,242 194,236 194,248" fill="#087f76"/><line x1="230" y1="242" x2="266" y2="242" stroke="#087f76" stroke-width="3" /><polygon points="280,242 266,248 266,236" fill="#087f76"/><text x="230" y="279" font-size="20" fill="#17354a" text-anchor="middle">Particles vibrate ↔</text><text x="70" y="218" font-size="17" fill="#17354a" text-anchor="start">Compression</text><text x="379" y="218" font-size="17" fill="#17354a" text-anchor="middle">Rarefaction</text><text x="240" y="311" font-size="17" fill="#17354a" text-anchor="middle">Snapshot model of a longitudinal wave</text></g></svg>
