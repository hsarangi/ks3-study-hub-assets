<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">Build an organism in levels</title><desc id="desc">A muscle cell belongs to muscle tissue. The heart contains several tissues. It works within the circulatory system, which is one of the systems in a human organism.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f76"/></marker></defs><rect width="480" height="320" fill="#fff"/><g font-family="Arial, sans-serif"><circle cx="65" cy="80" r="24" fill="#efbfbe" stroke="#17354a" stroke-width="2"/><text x="65" y="140" font-size="20" fill="#17354a" text-anchor="middle">Cell</text><line x1="100" y1="80" x2="161" y2="80" stroke="#087f76" stroke-width="3" /><polygon points="175,80 161,86 161,74" fill="#087f76"/><rect x="190" y="52" width="78" height="56" rx="12" fill="#efbfbe" stroke="#087f76" stroke-width="2"/><line x1="200" y1="65" x2="255" y2="65" stroke="#17354a" stroke-width="3" /><line x1="200" y1="80" x2="255" y2="80" stroke="#17354a" stroke-width="3" /><line x1="200" y1="95" x2="255" y2="95" stroke="#17354a" stroke-width="3" /><text x="230" y="140" font-size="20" fill="#17354a" text-anchor="middle">Tissue</text><line x1="280" y1="80" x2="341" y2="80" stroke="#087f76" stroke-width="3" /><polygon points="355,80 341,86 341,74" fill="#087f76"/><path d="M395 109C328 72 368 38 395 64C423 38 461 72 395 109Z" fill="#efbfbe" stroke="#a52f49" stroke-width="3" /><text x="395" y="140" font-size="20" fill="#17354a" text-anchor="middle">Organ</text><line x1="395" y1="159" x2="395" y2="197" stroke="#087f76" stroke-width="3" /><polygon points="395,211 389,197 401,197" fill="#087f76"/><rect x="295" y="230" width="165" height="50" rx="12" fill="#e8f5f2" stroke="#087f76" stroke-width="2"/><text x="377.5" y="261" font-size="18" fill="#17354a" text-anchor="middle">Organ system</text><line x1="283" y1="255" x2="197" y2="255" stroke="#087f76" stroke-width="3" /><polygon points="183,255 197,249 197,261" fill="#087f76"/><rect x="20" y="230" width="150" height="50" rx="12" fill="#e8f5f2" stroke="#087f76" stroke-width="2"/><text x="95" y="261" font-size="18" fill="#17354a" text-anchor="middle">Organism</text></g></svg>
