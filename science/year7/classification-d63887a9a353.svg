<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">Group by shared features</title><desc id="desc">Animals can be grouped by the presence of a backbone. Vertebrates include fish, amphibians, reptiles, birds and mammals; invertebrates lack a backbone. This is only part of classification.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f76"/></marker></defs><rect width="480" height="320" fill="#fff"/><g font-family="Arial, sans-serif"><rect x="160" y="20" width="160" height="50" rx="12" fill="#e8f5f2" stroke="#087f76" stroke-width="2"/><text x="240" y="51" font-size="18" fill="#17354a" text-anchor="middle">Animals</text><line x1="240" y1="70" x2="240" y2="95" stroke="#17354a" stroke-width="3" /><line x1="120" y1="95" x2="360" y2="95" stroke="#17354a" stroke-width="3" /><line x1="120" y1="95" x2="120" y2="110" stroke="#087f76" stroke-width="3" /><polygon points="120,124 114,110 126,110" fill="#087f76"/><line x1="360" y1="95" x2="360" y2="110" stroke="#087f76" stroke-width="3" /><polygon points="360,124 354,110 366,110" fill="#087f76"/><rect x="22" y="138" width="196" height="72" rx="12" fill="#e8f5f2" stroke="#087f76" stroke-width="2"/><text x="120" y="169" font-size="18" fill="#17354a" text-anchor="middle">Vertebrates</text><text x="120" y="194" font-size="17" fill="#17354a" text-anchor="middle">backbone</text><rect x="262" y="138" width="196" height="72" rx="12" fill="#e8f5f2" stroke="#087f76" stroke-width="2"/><text x="360" y="169" font-size="18" fill="#17354a" text-anchor="middle">Invertebrates</text><text x="360" y="194" font-size="17" fill="#17354a" text-anchor="middle">no backbone</text><text x="120" y="253" font-size="18" fill="#17354a" text-anchor="middle">Fish • birds</text><text x="360" y="253" font-size="18" fill="#17354a" text-anchor="middle">Insects • worms</text><text x="240" y="295" font-size="17" fill="#17354a" text-anchor="middle">Examples, not the whole classification system</text></g></svg>
