<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">The same tilt, two orbital positions</title><desc id="desc">Two Earths either side of the Sun have axes parallel in space. Left: the northern pole tilts towards the Sun, northern summer. Right: it tilts away, northern winter. Day and night instead result from daily rotation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f76"/></marker></defs><rect width="480" height="320" fill="#fff"/><g font-family="Arial, sans-serif"><circle cx="240" cy="140" r="32" fill="#f6d16c" stroke="#b45113" stroke-width="2"/><circle cx="105" cy="140" r="48" fill="#82bcd8" stroke="#1869b2" stroke-width="2"/><circle cx="375" cy="140" r="48" fill="#82bcd8" stroke="#1869b2" stroke-width="2"/><line x1="78" y1="201" x2="132" y2="79" stroke="#17354a" stroke-width="3" /><line x1="348" y1="201" x2="402" y2="79" stroke="#17354a" stroke-width="3" /><text x="139" y="68" font-size="20" fill="#17354a" text-anchor="middle">N</text><text x="409" y="68" font-size="20" fill="#17354a" text-anchor="middle">N</text><line x1="203" y1="140" x2="170" y2="140" stroke="#087f76" stroke-width="3" /><polygon points="156,140 170,134 170,146" fill="#087f76"/><line x1="277" y1="140" x2="310" y2="140" stroke="#087f76" stroke-width="3" /><polygon points="324,140 310,146 310,134" fill="#087f76"/><text x="105" y="246" font-size="19" fill="#17354a" text-anchor="middle">Northern</text><text x="105" y="272" font-size="20" fill="#17354a" text-anchor="middle">summer</text><text x="375" y="246" font-size="19" fill="#17354a" text-anchor="middle">Northern</text><text x="375" y="272" font-size="20" fill="#17354a" text-anchor="middle">winter</text><text x="240" y="311" font-size="17" fill="#17354a" text-anchor="middle">Axes stay parallel; sizes not to scale</text></g></svg>
